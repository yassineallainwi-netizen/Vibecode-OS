name: Smoke Tests

on:
  push:
    branches: [main]
    paths:
      - install.py
      - src/**
      - tests/smoke/**
      - .github/workflows/smoke-tests.yml
  pull_request:
    paths:
      - install.py
      - src/**
      - tests/smoke/**
      - .github/workflows/smoke-tests.yml
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run smoke tests
        run: python tests/smoke/run_smoke_tests.py
